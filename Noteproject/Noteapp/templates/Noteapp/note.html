{% extends 'Noteapp/main.html' %}
{% block form %}
<form class="d-flex" action="" method="get">
    <div class="input-group">
            <input type="search" name="q" class="form-control" placeholder="Search...">
            <button class="btn btn-outline-light" type="submit">Search</button>
    </div>
</form>
{% endblock %}
{% block content %}

<style>
    .main-container{
            display:  grid;
            grid-template-columns: 1fr 3fr 1fr;
            min-height: 100px;
            max-width: 90%;
            justify-self: center;
            justify-content: center;
            min-width: 1fr;
    }
    .card{
            border:  solid black 1px;
            margin: 2px;
            border-radius: 5px;
            min-width: 200px;
            background-color: white;
            padding: 5px;
    }
    .main-card{
            min-width: 450px;
    }
</style>
<div class="main-container">
    <div class="card">
            <div><h3>All Subjects</h3></div>
            
            <hr><a href="">Add NEW</a>
            <div>
                    {% for subject in subjects %}
                            <h4><a href="{% url 'subject' subject.id %}">{{subject}}</a></h4>
                            <hr>
                    {% endfor %}
            </div>
    </div>
    <div class="card main-card">
            <div><h3 class="card-title">{{ note.title }}</h3></div>
            <a class="btn btn-sm btn-outline-primary" href="{% url 'editNote' note.id %}">Edit</a>
            <a class="btn btn-sm btn-outline-danger" href="{% url 'deleteNote' note.id %}">Delete</a>
       
            <hr>
            <div class="">
                
                <p class="card-text">{{ note.note }}</p>
            </div>
    </div>
    <div class="card">
            <div><h3>Recent Notes</h3></div>
            <hr>
    </div>
</div>

{% endblock %}
