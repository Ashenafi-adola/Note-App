<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS (via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html{
            padding: 0px;
        }
        body{
            background-color: #e7faff;
            padding: 0px;
            margin: 0px;
        }
        nav{
          background-color: rgb(0, 255, 0);
          height: 80px;
          padding: 20px;
        }
        .search-form{
            display: inline-block;
            float: right;
            margin-bottom: 30px;
            margin-top: auto;
            vertical-align: middle;
        }
        .lgo-btn{
            background: #ff0000;
        }
        .lgo-btn:hover{
            background: #785858;
            color: #ffffff;
        }
        </style>
</head>
<body>
    <nav class="">

        <a class="" href="{% url 'home' %}">NOTE BOOK</a>
        {% if user.is_authenticated %}
         
            <a class="btn btn-outline-light me-2 lgo-btn" href="{% url 'logoutUser' %}">Logout</a>
            <div class="search-form">
              {% block form %}{% endblock %}
            </div>

            <span class="navbar-text">Hello {{user.username.capitalize}}</span>

        {% endif %}

    </nav>

    {% block content %}

    {% endblock %}
    <!-- Bootstrap bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
