{% extends 'Noteapp/main.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    {% if page == "signup" %}
                        <h2 class="card-title text-center mb-3">Signup</h2>
                        <form action="" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                {{ form.as_p }}
                            </div>
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary">Signup</button>
                            </div>
                        </form>
                        <p class="text-center mt-3">Already have an account? Signin <a href="{% url 'login' %}">Here!</a></p>
                    {% else %}
                        <h2 class="card-title text-center mb-3">Signin</h2>
                        <form action="" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" name="username" id="username" class="form-control" placeholder="Username">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Password">
                            </div>
                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary">Signin</button>
                            </div>
                        </form>
                        <p class="text-center mt-3">Don't have an account? Create <a href="{% url 'signup' %}">Here!</a></p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
