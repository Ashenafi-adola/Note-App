<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS (via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html{
            padding: 0px;
        }
        body{
            background-color: #e7faff;
            padding: 0px;
            margin: 0px;
        }
        /* keep any minimal custom styles here; navigation styling is handled by Bootstrap */
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">NOTE BOOK</a>
        {% if user.is_authenticated %}
          <div class="d-flex align-items-center ms-auto">
            <a class="btn btn-outline-light me-2" href="{% url 'logoutUser' %}">Logout</a>
            <div class="me-2">
              {% block form %}{% endblock %}
            </div>
            <span class="navbar-text">Hello {{user.username.capitalize}}</span>
          </div>
        {% endif %}
      </div>
    </nav>

    {% block content %}

    {% endblock %}
    <!-- Bootstrap bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
